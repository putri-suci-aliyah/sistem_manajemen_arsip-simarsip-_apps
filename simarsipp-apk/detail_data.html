<!doctype html> 
<html>
<head>
  <meta charset="utf-8"> 
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"> 
  <title>Detail Pengajuan - BAA</title> 
  
  <!-- Framework7 Styles -->
  <link rel="stylesheet" href="https://cdn.framework7.io/framework7/5.7.10/css/framework7.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <style> 
    * { box-sizing: border-box; }
    body { background: #f4f7fb; margin: 0 auto; max-width: 480px; font-family: -apple-system, sans-serif; }
    .app-header { background: linear-gradient(135deg, #007aff 0%, #005bb5 100%); padding: 16px; color: white; display: flex; align-items: center; gap: 12px; }
    .back-btn { cursor: pointer; display: flex; align-items: center; }
    .page-content { padding: 20px 16px; padding-bottom: 120px; }
    
    /* Card & Status Styling */
    .detail-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .detail-label { font-size: 11px; color: #888; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .status-pill { display: inline-block; padding: 6px 16px; border-radius: 50px; font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; }
    .status-pending { background: #fff3e0; color: #ff9800; }
    .status-approved { background: #e0f9f1; color: #00c082; }
    .status-rejected { background: #ffebee; color: #ff4b5c; }
    
    /* Footer & Buttons */
    .fixed-footer { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: white; padding: 16px; display: flex; gap: 10px; border-top: 1px solid #eee; z-index: 999; }
    .btn-footer { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: 800; font-size: 14px; cursor: pointer; }
    .btn-approve { background: #00eb9f; color: white; }
    .btn-approve:disabled { background: #cbd5e1 !important; color: #94a3b8 !important; cursor: not-allowed; opacity: 0.7; }
    .btn-reject { background: #ff4b5c; color: white; }
    
    /* Modal / Pop-up Custom */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: opacity .2s ease, visibility .2s ease; z-index: 2000; }
    .modal-overlay.show { visibility: visible; opacity: 1; }
    .modal-card { width: min(92%, 420px); background: white; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    .modal-card textarea, .modal-card input[type="date"] { width: 100%; border: 1px solid #ddd; border-radius: 10px; padding: 12px; font-size: 14px; margin-bottom: 12px; box-sizing: border-box; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px; }
    .modal-actions button { flex: 1; border: none; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer; }
    .btn-cancel { background: #e2e8f0; color: #475569; }
    .btn-submit { background: #0a73ff; color: white; }
    
    /* Pop-up Sukses Modern */
    .success-popup { text-align: center; padding: 10px; }
    .success-icon { font-size: 56px; color: #00c082; margin-bottom: 10px; }
    .success-title { font-size: 18px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
    .success-msg { font-size: 14px; color: #64748b; margin-bottom: 20px; }
    
    /* Upload Section */
    .ttd-upload { margin-top: 14px; padding: 16px; border: 1px dashed #cbd5e1; border-radius: 14px; text-align: center; background: #f8fafc; }
    .ttd-preview { display: block; max-width: 120px; max-height: 120px; margin: 12px auto 0; border-radius: 12px; object-fit: contain; border: 1px solid #ddd; background: white; }
    
    /* Styling Dokumen Kertas Surat */
    .surat-container { background: white; padding: 24px; border: 1px solid #ddd; font-family: "Times New Roman", Times, serif; line-height: 1.6; color: black; font-size: 13px; }
    .header-kop { text-align: center; border-bottom: 3px double black; padding-bottom: 10px; margin-bottom: 20px; }
    .header-kop h1 { margin: 0; font-size: 18px; color: #003366; font-weight: bold; }
    .header-kop h2 { margin: 5px 0 0 0; font-size: 14px; font-weight: normal; }
    .header-kop p { margin: 5px 0 0 0; font-size: 10px; font-style: italic; }
    .isi-surat { margin-top: 20px; text-align: justify; }
    .ttd-container { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; row-gap: 35px; text-align: center; justify-items: center; }
    .ttd-box { display: flex; flex-direction: column; align-items: center; }
    .ttd-box.baa-box { grid-column: span 2; width: 100%; margin-top: 15px; }
    .ttd-space { height: 50px; display: flex; align-items: center; justify-content: center; }
    .ttd-space img { max-height: 50px; max-width: 100px; object-fit: contain; }
    .ttd-nama { font-weight: bold; border-bottom: 1px solid #000; min-width: 120px; font-size: 11px; }
    .table-detail { width: 100%; border-collapse: collapse; margin: 15px 0; }
    .table-detail th, .table-detail td { border: 1px solid black; padding: 8px; text-align: left; }
    .table-detail th { background: #f2f2f2; text-align: center; font-weight: bold; }
  </style>
</head>

<body class="framework7-root"> 

  <div class="view view-main">
    <div class="page">
      
      <header class="app-header">
        <div class="back-btn" onclick="window.history.back()">
          <i class="material-icons">arrow_back</i>
        </div>
        <div style="font-weight:700; font-size:18px;">Detail Pengajuan</div>
      </header>

      <main class="page-content">
        <div id="dynamic-wrapper">
          <div style="text-align: center; padding: 40px; color: #999;">Memuat dokumen pengajuan...</div>
        </div>
      </main>

      <div class="fixed-footer" id="footer-action" style="display: none;">
        <button class="btn-footer btn-reject" id="btnReject">Tolak</button>
        <button class="btn-footer btn-approve" id="btnApprove" disabled>Setujui</button>
      </div>

    </div>
  </div>

  <!-- POP-UP INPUT REVISI / PENOLAKAN -->
  <div class="modal-overlay" id="rejectModal">
    <div class="modal-card">
      <h3 style="margin-top:0;">Tolak dan Minta Revisi</h3>
      <textarea id="rejectComment" placeholder="Tulis komentar revisi untuk organisasi..." rows="4"></textarea>
      <input type="date" id="revisionDeadline" />
      <div class="modal-actions">
        <button class="btn-cancel" type="button" onclick="closeRejectModal()">Batal</button>
        <button class="btn-submit" type="button" onclick="submitReject()">Kirim & Tolak</button>
      </div>
    </div>
  </div>

  <!-- POP-UP NOTIFIKASI BERHASIL CUSTOM (MENGGANTIKAN ALERT JADUL) -->
  <div class="modal-overlay" id="successModal">
    <div class="modal-card" style="width: min(85%, 360px);">
      <div class="success-popup">
        <i class="material-icons success-icon" id="popIcon">check_circle</i>
        <div class="success-title" id="popTitle">Berhasil!</div>
        <div class="success-msg" id="popMessage">Aksi dokumen Anda telah sukses diproses.</div>
        <button class="btn-submit" style="width:100%; padding:12px; border-radius:10px;" onclick="closeSuccessModal()">Selesai</button>
      </div>
    </div>
  </div>

  <!-- Firebase Legacy SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyBtyn-cjuhsnlEn-9Wao1tCcJfUQbf6GnY",
        authDomain: "simarsip-apk.firebaseapp.com",
        databaseURL: "https://simarsip-apk-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "simarsip-apk",
        storageBucket: "simarsip-apk.appspot.com"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let hasBaaSignature = false;
    let type = "";
    let id = "";

    // Fungsi Pemanggil Pop-up Sukses Custom
    function showSuccessPopup(title, message, isReject = false) {
        document.getElementById('popTitle').innerText = title;
        document.getElementById('popMessage').innerText = message;
        
        const iconEl = document.getElementById('popIcon');
        if(isReject) {
            iconEl.innerText = "cancel";
            iconEl.style.color = "#ff4b5c";
        } else {
            iconEl.innerText = "check_circle";
            iconEl.style.color = "#00c082";
        }
        document.getElementById('successModal').classList.add('show');
    }

    function closeSuccessModal() {
        document.getElementById('successModal').classList.remove('show');
        window.location.reload(); // Segarkan halaman agar status terbaru terkunci
    }

    function renderView(data) {
        const wrapper = document.getElementById('dynamic-wrapper'); 
        const footer = document.getElementById('footer-action'); 

        const chairName = data.ormawa || data.name || '................';
        const secretaryName = data.sekretaris || data.lecturer || '................';
        
        const chairTtdHtml = data.ttd && data.ttd.ormawa ? `<img src="${data.ttd.ormawa}" alt="TTD">` : (data.ormawa_signature ? `<img src="${data.ormawa_signature}" alt="TTD">` : '');
        const secretaryTtdHtml = data.ttd && data.ttd.sekretaris ? `<img src="${data.ttd.sekretaris}" alt="TTD">` : (data.secretary_signature ? `<img src="${data.secretary_signature}" alt="TTD">` : '');
        
        const baaSignatureUrl = data.baa_signature_url || data.baa_signature || (data.ttd && data.ttd.baa) || null;
        const baaTtdHtml = baaSignatureUrl ? `<img src="${baaSignatureUrl}" alt="TTD BAA" id="baa-ttd-img-kop">` : '';

        hasBaaSignature = !!baaSignatureUrl;

        const normalizedStatus = String(data.status || 'pending').trim().toLowerCase();
        let statusText = 'MENUNGGU';
        if (normalizedStatus === 'approved' || normalizedStatus === 'disetujui') statusText = 'DISETUJUI';
        if (normalizedStatus === 'rejected' || normalizedStatus === 'ditolak') statusText = 'DITOLAK';

        function formatDateForLetter(dateStr) {
            if (!dateStr) return '................';
            const date = new Date(dateStr);
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
        }

        let htmlContent = `
            <div class="status-pill status-${normalizedStatus === 'revisi' || normalizedStatus === 'disetujui' || normalizedStatus === 'approved' ? 'approved' : (normalizedStatus === 'ditolak' || normalizedStatus === 'rejected' ? 'rejected' : 'pending')}">${statusText}</div>

            <div class="surat-container">
                <div class="header-kop">
                    <h2 id="kop-org">${data.organisasi ? data.organisasi.toUpperCase() : 'YAYASAN LPKIA'}</h2>
                    <h1 id="kop-nama">INSTITUT DIGITAL EKONOMI LPKIA</h1>
                    <p id="kop-alamat">${data.kampus || 'Jl. Soekarno-Hatta No.456, Bandung, Jawa Barat 40266'}</p>
                </div>

                <p style="text-align: right; margin-bottom: 20px;">Bandung, ${formatDateForLetter(data.createdAt || data.date)}</p>

                <div style="margin-bottom: 20px;">
                    Nomor : ___/<span id="kop-code">LPKIA</span>/BKM/2026<br>
                    Hal : <b>Permohonan ${type === 'ruangan' ? 'Peminjaman Ruangan' : type === 'peralatan' ? 'Peminjaman Peralatan' : 'Dispensasi Ujian'}</b>
                </div>

                <div class="isi-surat">
                    <p>Kepada Yth.<br><b>Bagian Sarana dan Prasarana (BAA)</b><br>${data.kampus ? data.kampus.split('-')[0].trim() : 'IDE LPKIA'}</p>
        `;

        if (type === 'ruangan') {
            htmlContent += `
                    <p>Dengan hormat, sehubungan dengan kegiatan <b>${data.title || '..................'}</b> yang akan dilaksanakan pada tanggal <b>${formatDateForLetter(data.date)}</b> jam <b>${data.start || '00:00'} WIB</b>, kami memohon izin meminjam ruangan dengan rincian sebagai berikut:</p>

                    <table class="table-detail">
                        <thead>
                            <tr>
                                <th>Nama Ruangan</th>
                                <th style="text-align:center;">Durasi</th>
                                <th style="text-align:center;">Jam</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>${data.room || '..................'}</td>
                                <td style="text-align:center;">${data.duration || '1'} hari</td>
                                <td style="text-align:center;">${data.start || '00:00'} - ${data.end || '00:00'} WIB</td>
                            </tr>
                        </tbody>
                    </table>
                    <p>Demikian permohonan ini kami sampaikan. Kami bertanggung jawab penuh atas keamanan ruangan tersebut. Atas perhatian Bapak/Ibu, kami ucapkan terima kasih.</p>
            `;
        } else if (type === 'peralatan') {
            htmlContent += `
                    <p>Dengan hormat, sehubungan dengan kegiatan <b>${data.title || '..................'}</b> yang akan dilaksanakan pada tanggal <b>${formatDateForLetter(data.borrowDate || data.date)}</b>, kami memohon izin meminjam peralatan dengan rincian sebagai berikut:</p>

                    <table class="table-detail">
                        <thead>
                            <tr>
                                <th>Nama Peralatan</th>
                                <th style="text-align:center;">Jumlah</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>${data.equipmentName || '..................'}</td>
                                <td style="text-align:center;">${data.quantity || '1'} unit</td>
                            </tr>
                        </tbody>
                    </table>
                    <p>Demikian permohonan ini kami sampaikan. Atas perhatian Bapak/Ibu, kami ucapkan terima kasih.</p>
            `;
        } else if (type === 'dispensasi') {
            htmlContent += `
                    <p>Dengan hormat, kami mohon untuk memberikan dispensasi kepada mahasiswa bernama <b>${data.name || '..................'}</b> untuk ujian mata kuliah <b>${data.course || '..................'}</b> pada tanggal <b>${formatDateForLetter(data.date)}</b>.</p>
                    <div style="margin: 10px 0 10px 20px;"><i>Keterangan: ${data.note || '-'}</i></div>
                    <p>Demikian permohonan ini kami sampaikan. Atas perhatian Bapak/Ibu, kami ucapkan terima kasih.</p>
            `;
        }

        // After rendering, prefer centralized helper values for kop if available and also set kop-code/recipient
        setTimeout(() => {
            if (typeof getLoggedUser !== 'function') return;
            const u = getLoggedUser(); if (!u) return;
            const org = u.organisasi || u.organization || null;
            const kampus = u.kampus || u.campus || null;
            if (org) { const el = document.getElementById('kop-org'); if (el) el.textContent = org.toUpperCase(); }
            if (kampus) {
                let campusRaw = String(kampus || '').trim();
                let short = (campusRaw.match(/\(([^)]+)\)/) || [])[1] || (campusRaw.indexOf(' - ') !== -1 ? campusRaw.split(' - ')[0] : campusRaw);
                short = short ? short.trim() : '';
                let address = campusRaw.indexOf(' - ') !== -1 ? campusRaw.split(' - ')[1].trim() : campusRaw.replace(/\([^)]*\)/,'').trim();
                const el2 = document.getElementById('kop-alamat'); if (el2 && address) el2.textContent = address;
                const codeEl = document.getElementById('kop-code'); if (codeEl) codeEl.textContent = (short || '').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
                const recEl = document.getElementById('kop-recipient-campus'); if (recEl && short) recEl.textContent = short;
                const h1 = document.getElementById('kop-nama'); if (h1 && short) h1.textContent = short;
            }
        }, 50);

        htmlContent += `
                </div>

                <div class="ttd-container">
                    <div class="ttd-box">
                        <div>Ketua Ormawa,</div>
                        <div class="ttd-space">${chairTtdHtml}</div>
                        <div class="ttd-nama">${chairName}</div>
                    </div>
                    <div class="ttd-box">
                        <div>Sekretaris,</div>
                        <div class="ttd-space">${secretaryTtdHtml}</div>
                        <div class="ttd-nama">${secretaryName}</div>
                    </div>
                    <div class="ttd-box baa-box">
                        <div>Menyetujui,<br>BAA</div>
                        <div class="ttd-space" id="baa-ttd-preview-kop">${baaTtdHtml}</div>
                        <div class="ttd-nama">________________</div>
                    </div>
                </div>
            </div>

            <!-- ALUR ALIRAN STATUS & PROTEKSI INPUT FILE -->
            <div class="detail-card" style="margin-top: 20px;">
                <div class="detail-label">STATUS TANDA TANGAN BAA</div>
                <div class="ttd-upload">
                    
                    ${(normalizedStatus === 'pending' || normalizedStatus === 'revisi') ? `
                        <div style="margin-bottom: 10px; color: #475569; font-size: 14px;">Silakan pilih gambar berkas tanda tangan resmi BAA.</div>
                        <input type="file" id="baaTtdInput" accept="image/*" onchange="uploadBaaTtd(event)">
                    ` : `
                        <div style="margin-bottom: 5px; color: #00c082; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 4px;">
                            <i class="material-icons" style="font-size:18px;">lock</i>
                            Akses Unggah Terkunci (Dokumen Sah)
                        </div>
                    `}

                    <div id="wrapper-preview-img" style="margin-top:10px;">
                        ${baaSignatureUrl ? `<img src="${baaSignatureUrl}" alt="TTD BAA" class="ttd-preview" id="baa-ttd-img-bottom">` : `<div style="color:#999;font-size:13px;">Belum ada berkas tanda tangan diunggah.</div>`}
                    </div>
                </div>
            </div>
        `;

        if (data.rejection_reason) {
            htmlContent += `
                <div class="detail-card">
                    <div style="border-left: 4px solid #ff4b5c; background:#fff1f2; padding: 12px 16px; border-radius:6px;">
                        <div style="font-weight:700; color:#444; font-size:13px; margin-bottom:4px;">Catatan Revisi BAA:</div>
                        <div style="font-size:14px; color:#666;">${data.rejection_reason}</div>
                    </div>
                </div>
            `;
        }

        wrapper.innerHTML = htmlContent;

        // Kontrol penampil Footer Aksi
        if (normalizedStatus === 'pending' || normalizedStatus === 'revisi') {
            footer.style.display = 'flex';
            const btnApprove = document.getElementById('btnApprove');
            const btnReject = document.getElementById('btnReject');
            
            if (btnApprove) {
                if (hasBaaSignature) btnApprove.removeAttribute('disabled');
                else btnApprove.setAttribute('disabled', 'true');
                btnApprove.onclick = () => updateStatus('approved');
            }
            if (btnReject) btnReject.onclick = () => openRejectModal();
        } else {
            footer.style.display = 'none';
        }
    }

    function loadDetail() {
        const paramsUrl = new URLSearchParams(window.location.search);
        type = paramsUrl.get('type');
        id = paramsUrl.get('id');

        // Fallback testing data jika parameter kosong
        if (!type || !id) {
            type = "ruangan";
            id = "ruangan_1781117965618"; 
        }

        db.ref(`pengajuan/${type}/${id}`).on('value', snap => {
            const data = snap.val(); 
            if (data) {
                renderView(data);
            } else {
                document.getElementById('dynamic-wrapper').innerHTML = `
                    <div class='detail-card' style='text-align:center; padding:20px;'>
                        <p style='color:#ff4b5c; font-weight:bold;'>Data Tidak Ditemukan</p>
                    </div>`;
            }
        });
    }

    // FUNGSI UPLOAD BASE64 (Bebas dari hambatan CORS Storage)
    function uploadBaaTtd(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        if (file.size > 1024 * 1024) {
            alert("Ukuran gambar terlalu besar! Gunakan foto di bawah 1 MB.");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Url = e.target.result;

            db.ref(`pengajuan/${type}/${id}`).update({
                baa_signature: base64Url,
                baa_signature_url: base64Url,
                updatedAt: new Date().toISOString()
            }).then(() => {
                showSuccessPopup("Tanda Tangan Diterapkan", "Berkas TTD BAA berhasil dimuat ke dalam dokumen.");
                
                const kopPreview = document.getElementById('baa-ttd-preview-kop');
                if (kopPreview) kopPreview.innerHTML = `<img src="${base64Url}" alt="TTD BAA">`;

                const btnApprove = document.getElementById('btnApprove');
                if (btnApprove) btnApprove.removeAttribute('disabled');
            });
        };
        reader.readAsDataURL(file);
    }

    function updateStatus(newStatus) {
        if (!type || !id) return;
        
        // Pengecekan Eksistensi Elemen yang aman (Pembersih Bug innerHTML Null)
        const bottomImg = document.getElementById('baa-ttd-img-bottom');
        const currentSignatureUrl = bottomImg ? bottomImg.src : "";

        const payload = {
            status: newStatus,
            updatedAt: new Date().toISOString()
        };

        if (newStatus === 'approved') {
            payload.approvedAt = new Date().toISOString();
            if (currentSignatureUrl) {
                payload.baa_signature = currentSignatureUrl;
                payload.baa_signature_url = currentSignatureUrl;
            }
        }

        db.ref(`pengajuan/${type}/${id}`).update(payload)
        .then(() => {
            showSuccessPopup("Dokumen Disetujui", "Surat penginjinan resmi berhasil disahkan dan ditandatangani.");
        });
    }

    function openRejectModal() { document.getElementById('rejectModal').classList.add('show'); }
    function closeRejectModal() { document.getElementById('rejectModal').classList.remove('show'); }

    function submitReject() {
        const comment = document.getElementById('rejectComment').value.trim();
        const deadline = document.getElementById('revisionDeadline').value;
        if (!comment) {
            alert('Silakan tulis alasan penolakan terlebih dahulu.');
            return;
        }

        const payload = { status: 'rejected', rejection_reason: comment, updatedAt: new Date().toISOString() };
        if (deadline) payload.revision_deadline = deadline;

        db.ref(`pengajuan/${type}/${id}`).update(payload)
        .then(() => {
            closeRejectModal();
            showSuccessPopup("Dokumen Ditolak", "Status diubah menjadi Ditolak dan catatan dikirim ke Ormawa.", true);
        });
    }

    window.addEventListener('load', loadDetail);
  </script>
</body>
</html>
