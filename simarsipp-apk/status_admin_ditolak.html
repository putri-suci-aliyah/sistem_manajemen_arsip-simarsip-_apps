<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengajuan Ditolak - Admin</title>
    <link rel="stylesheet" href="https://cdn.framework7.io/framework7/5.7.10/css/framework7.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f7fb; }
        .header { background: linear-gradient(135deg, #d32f2f, #ff5252); color: white; padding: 18px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
        .back-btn { color: white; background: rgba(255,255,255,0.18); border: none; width: 42px; height: 42px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .header-title { font-size: 18px; font-weight: 700; }
        .page-content { padding: 16px; padding-bottom: 80px; }
        .summary-card { background: white; border-radius: 18px; padding: 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.07); margin-bottom: 16px; }
        .summary-card h2 { margin: 0 0 8px; font-size: 18px; }
        .summary-count { font-size: 36px; font-weight: 800; color: #333; }
        .search-row { display: grid; gap: 12px; margin-bottom: 16px; }
        .search-row input, .search-row select { width: 100%; border-radius: 14px; border: 1px solid #ddd; padding: 12px 14px; font-size: 14px; }
        .status-list { display: grid; gap: 14px; }
        .item-card { background: white; border-radius: 18px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); padding: 16px; }
        .item-card:hover { transform: translateY(-1px); transition: transform 0.2s; }
        .item-row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
        .item-title { font-weight: 700; font-size: 15px; margin: 0 0 8px; color: #222; }
        .item-meta { color: #666; font-size: 13px; line-height: 1.55; }
        .status-badge { display: inline-flex; padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; background: #ffebee; color: #b71c1c; }
        .detail-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; width: 100%; background: #0a73ff; border: none; border-radius: 12px; color: white; padding: 12px; font-weight: 700; cursor: pointer; text-decoration: none; }
        .empty-state { text-align: center; color: #777; padding: 40px 10px; }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="window.location.href='index_admin.html'">
            <i class="material-icons">arrow_back</i>
        </button>
        <div>
            <div class="header-title">Pengajuan Ditolak</div>
            <div style="font-size:13px; color: rgba(255,255,255,0.9);">Data langsung diambil dari Firebase</div>
        </div>
    </div>
    <main class="page-content">
        <div class="summary-card">
            <h2>Total Ditolak</h2>
            <div id="statusCount" class="summary-count">...</div>
        </div>
        <div class="search-row">
            <input id="searchInput" type="text" placeholder="Cari judul, organisasi, atau pengaju..." oninput="filterAndRender()">
            <select id="sortSelect" onchange="filterAndRender()">
                <option value="date_desc">Terbaru</option>
                <option value="date_asc">Terlama</option>
                <option value="alpha_asc">A-Z</option>
                <option value="alpha_desc">Z-A</option>
            </select>
        </div>
        <div id="statusList" class="status-list">
            <div class="empty-state">Memuat...</div>
        </div>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script>
        const pageStatus = 'rejected';
        const firebaseConfig = {
            apiKey: "AIzaSyBtyn-cjuhsnlEn-9Wao1tCcJfUQbf6GnY",
            authDomain: "simarsip-apk.firebaseapp.com",
            databaseURL: "https://simarsip-apk-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "simarsip-apk"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let allItems = [];

        function getLoggedUser() {
            const raw = localStorage.getItem('loggedUser');
            return raw ? JSON.parse(raw) : null;
        }

        function ensureAdmin() {
            const user = getLoggedUser();
            if (!user || (user.role !== 'Admin Simarsip' && user.role !== 'super_admin')) {
                window.location.href = 'splash.html';
                return false;
            }
            return true;
        }

        function buildItem(item, type, id) {
            return {
                id,
                type,
                title: item.title || item.namaKegiatan || item.name || 'Tanpa Judul',
                organisasi: item.organisasi || item.pengaju || item.user || '-',
                name: item.pengaju || item.user || item.name || '-',
                subText: item.room || item.equipmentName || item.lokasi || '-',
                date: item.date || item.createdAt || '-',
                status: item.status || 'rejected',
                raw: item
            };
        }

        function fetchStatusItems() {
            if (!ensureAdmin()) return;

            db.ref('pengajuan').on('value', snapshot => {
                const data = snapshot.val() || {};
                allItems = [];

                Object.keys(data).forEach(type => {
                    Object.keys(data[type] || {}).forEach(id => {
                        const item = data[type][id];
                        if (item.status === pageStatus) {
                            allItems.push(buildItem(item, type, id));
                        }
                    });
                });

                document.getElementById('statusCount').textContent = allItems.length;
                filterAndRender();
            });
        }

        function formatDate(value) {
            const date = new Date(value);
            if (!value || isNaN(date)) return value || '-';
            return date.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function filterAndRender() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            let filtered = allItems.filter(item => {
                const text = `${item.title} ${item.organisasi} ${item.name} ${item.subText}`.toLowerCase();
                return text.includes(query);
            });

            const sortValue = document.getElementById('sortSelect').value;
            filtered.sort((a, b) => {
                if (sortValue === 'alpha_asc') return a.title.localeCompare(b.title);
                if (sortValue === 'alpha_desc') return b.title.localeCompare(a.title);
                const dateA = new Date(a.date || a.raw.createdAt || 0).getTime();
                const dateB = new Date(b.date || b.raw.createdAt || 0).getTime();
                return sortValue === 'date_asc' ? dateA - dateB : dateB - dateA;
            });

            renderStatusList(filtered);
        }

        function renderStatusList(items) {
            const container = document.getElementById('statusList');
            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">Tidak ada pengajuan dengan status ini.</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-row">
                        <div>
                            <div class="item-title">${item.title}</div>
                            <div class="item-meta">${item.organisasi} • ${item.name}</div>
                            <div class="item-meta">${formatDate(item.date)} • ${item.subText}</div>
                        </div>
                        <div class="status-badge">DITOLAK</div>
                    </div>
                    <button class="detail-btn" onclick="goToDetail('${item.type}', '${item.id}')">Lihat Detail</button>
                `;
                container.appendChild(card);
            });
        }

        function goToDetail(type, id) {
            window.location.href = `detail-pengajuan.html?type=${type}&id=${id}`;
        }

        document.addEventListener('DOMContentLoaded', fetchStatusItems);
    </script>
</body>
</html>
