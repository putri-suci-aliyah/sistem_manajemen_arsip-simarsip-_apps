<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Riwayat Persuratan - BAA</title>
    <link rel="stylesheet" href="https://cdn.framework7.io/framework7/5.7.10/css/framework7.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            background: #f4f7fb;
            font-family: -apple-system, sans-serif;
            margin: 0;
        }

        .app-header {
            background: #007aff;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .filter-container {
            background: white;
            padding: 10px 16px;
            border-bottom: 1px solid #eee;
        }

        .search-container {
            padding: 10px 0;
        }

        .search-input {
            width: 100%;
            border: none;
            background: #f0f0f0;
            padding: 12px;
            border-radius: 10px;
            outline: none;
            box-sizing: border-box;
        }

        /* Filter Status Chips */
        .status-filter-box {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-chip {
            padding: 8px 16px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .filter-chip.active {
            background: #007aff;
            color: white;
        }

        .section {
            padding: 16px;
            padding-bottom: 100px;
        }

        .archive-card {
            background: white;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            position: relative;
            border-left: 5px solid #ddd;
            cursor: pointer;
        }

        .archive-card.approved {
            border-left-color: #4caf50;
        }

        .archive-card.rejected {
            border-left-color: #f44336;
        }

        .status-tag {
            position: absolute;
            top: 18px;
            right: 15px;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
        }

        .tag-approved {
            background: #e8f5e9;
            color: #4caf50;
        }

        .tag-rejected {
            background: #ffebee;
            color: #f44336;
        }

        .archive-card h4 {
            margin: 0;
            font-size: 16px;
            color: #333;
            padding-right: 80px;
        }

        .archive-card small {
            display: block;
            margin-top: 8px;
            color: #888;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="app-header">
        <i class="material-icons" style="cursor:pointer" onclick="window.location.href='index_baa.html'">arrow_back</i>
        <div style="font-weight:700; font-size:18px;">Riwayat Persuratan</div>
    </div>

    <div class="filter-container">
        <div class="search-container">
            <input type="text" id="searchArsip" class="search-input" placeholder="Cari judul surat atau kegiatan..."
                onkeyup="filterArsip()">
        </div>
        <div class="status-filter-box">
            <div class="filter-chip active" onclick="setStatusFilter('all', this)">Semua</div>
            <div class="filter-chip" onclick="setStatusFilter('approved', this)">Disetujui</div>
            <div class="filter-chip" onclick="setStatusFilter('rejected', this)">Ditolak</div>
        </div>
    </div>

    <div class="section" id="archive-list">
        <p style="text-align:center; color:#aaa; margin-top: 50px;">Memuat riwayat...</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="js/campus-utils.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBtyn-cjuhsnlEn-9Wao1tCcJfUQbf6GnY",
            authDomain: "simarsip-apk.firebaseapp.com",
            databaseURL: "https://simarsip-apk-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "simarsip-apk"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allArchives = [];
        let currentStatusFilter = 'all';

        const dummyArsip = [
            { id: 'dummy-1', title: "Peminjaman Aula Utama", status: "approved", date: "2026-01-10", type: "ruangan" },
            { id: 'dummy-2', title: "Dispensasi Lomba Robotik", status: "rejected", date: "2026-01-12", type: "dispensasi" },
            { id: 'dummy-3', title: "Seminar Nasional Teknologi", status: "approved", date: "2026-01-17", type: "ruangan" },
            { id: 'dummy-4', title: "Workshop UI/UX Design", status: "approved", date: "2026-01-08", type: "peralatan" },
            { id: 'dummy-5', title: "Rapat Koordinasi Ormawa", status: "rejected", date: "2026-01-09", type: "ruangan" },
            { id: 'dummy-6', title: "Pengajuan Dana Hibah", status: "approved", date: "2026-01-11", type: "lainnya" },
            { id: 'dummy-7', title: "Lomba E-Sport Kampus", status: "rejected", date: "2026-01-13", type: "ruangan" }
        ];

        // Ambil data dari Firebase
        db.ref('pengajuan').on('value', snap => {
            const fbArsip = [];
            const data = snap.val();
            const loggedUser = getLoggedUser();
            const userCampus = getUserCampus(loggedUser);
            const userOrg = getUserOrg(loggedUser);
            if (data) {
                Object.keys(data).forEach(cat => {
                    Object.keys(data[cat]).forEach(id => {
                        const item = data[cat][id];
                        // filter by campus/org if user has them defined
                        if (userCampus || userOrg) {
                          if (!belongsToUserCampusOrOrg(item, userCampus, userOrg)) return;
                        }
                        // Masukkan hanya yang statusnya bukan 'pending'
                        if (item.status && item.status !== 'pending') {
                            fbArsip.push({
                                ...item,
                                id: id,
                                type: cat,
                                title: item.title || item.namaKegiatan || 'Tanpa Judul'
                            });
                        }
                    });
                });
            }
            // Gabungkan dummy dan firebase, urutkan berdasarkan tanggal terbaru
            allArchives = [...fbArsip, ...dummyArsip].sort((a, b) => new Date(b.date) - new Date(a.date));
            filterArsip(); // Render awal
        });

        function setStatusFilter(status, el) {
            // Update UI chip
            document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
            el.classList.add('active');

            // Set filter logic
            currentStatusFilter = status;
            filterArsip();
        }

        function filterArsip() {
            const searchText = document.getElementById('searchArsip').value.toLowerCase();

            const filtered = allArchives.filter(a => {
                const matchSearch = a.title.toLowerCase().includes(searchText);
                const matchStatus = (currentStatusFilter === 'all') || (a.status === currentStatusFilter);
                return matchSearch && matchStatus;
            });

            renderArsip(filtered);
        }

        function renderArsip(data) {
            const wrap = document.getElementById('archive-list');
            if (data.length === 0) {
                wrap.innerHTML = `
                    <div style="text-align:center; margin-top:50px;">
                        <i class="material-icons" style="font-size:48px; color:#ddd;">history</i>
                        <p style="color:#aaa;">Tidak ada riwayat ditemukan.</p>
                    </div>`;
                return;
            }

            wrap.innerHTML = data.map(a => {
                const isApproved = a.status === 'approved';
                return `
                <div class="archive-card ${isApproved ? 'approved' : 'rejected'}" onclick="openDetail('${a.type}', '${a.id || a.firebaseId}')">
                    <span class="status-tag ${isApproved ? 'tag-approved' : 'tag-rejected'}">
                        ${isApproved ? 'DISETUJUI' : 'DITOLAK'}
                    </span>
                    <h4>${a.title}</h4>
                    <small>${a.type} • ${formatDate(a.date)}</small>
                </div>
                `;
            }).join('');
        }

        function formatDate(dateStr) {
            if (!dateStr) return "-";
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        }

        function openDetail(type, id) {
            window.location.href = `detail-riwayat.html?type=${type}&id=${id}`;
        }
    </script>
</body>

</html>
