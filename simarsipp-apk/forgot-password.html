<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui">
    <title>Lupa Password - SIMARSIP</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .reset-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-in-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reset-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px 30px;
            text-align: center;
            color: white;
        }

        .reset-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .reset-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .reset-subtitle {
            font-size: 13px;
            opacity: 0.9;
        }

        .reset-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #333;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-container .form-input {
            width: 100%;
            padding-right: 45px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #666;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: #333;
        }

        .btn-reset {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }

        .btn-reset:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: #ff5252;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease-in-out;
        }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .info-message {
            background: #2196F3;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .info-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .reset-footer {
            padding: 20px 30px;
            text-align: center;
            border-top: 1px solid #f0f0f0;
        }

        .reset-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .reset-footer a:hover {
            color: #764ba2;
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 12px;
            color: #999;
        }

        .step-indicator .step {
            text-align: center;
            flex: 1;
        }

        .step-indicator .step.active {
            color: #667eea;
            font-weight: 600;
        }

        .hidden-form {
            display: none;
        }

        .visible-form {
            display: block;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <div class="reset-icon">🔑</div>
            <div class="reset-title">Lupa Password?</div>
            <div class="reset-subtitle">Atur ulang password Anda</div>
        </div>

        <div class="reset-body">
            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>
            <div class="info-message" id="infoMsg"></div>

            <!-- STEP 1: Verify Email -->
            <div id="step1Form" class="visible-form">
                <div class="step-indicator">
                    <div class="step active">1️⃣ Email</div>
                    <div class="step">2️⃣ Ubah Password</div>
                </div>

                <form onsubmit="handleVerifyEmail(event)">
                    <div class="form-group">
                        <label class="form-label">📧 Email Anda</label>
                        <input type="email" id="emailInput" class="form-input" placeholder="Masukkan email yang terdaftar" required>
                    </div>

                    <button type="submit" class="btn-reset" id="verifyBtn">Verifikasi Email</button>
                </form>
            </div>

            <!-- STEP 2: Reset Password -->
            <div id="step2Form" class="hidden-form">
                <div class="step-indicator">
                    <div class="step">1️⃣ Email</div>
                    <div class="step active">2️⃣ Ubah Password</div>
                </div>

                <form onsubmit="handleResetPassword(event)">
                    <div class="form-group">
                        <label class="form-label">📧 Email</label>
                        <input type="email" id="resetEmailDisplay" class="form-input" readonly style="background-color: #f5f5f5; cursor: not-allowed;">
                    </div>

                    <div class="form-group">
                        <label class="form-label">🔐 Password Baru</label>
                        <div class="password-container">
                            <input type="password" id="newPasswordInput" class="form-input" placeholder="Minimal 6 karakter" required minlength="6">
                            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('newPasswordInput')">👁️</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">✔️ Konfirmasi Password</label>
                        <div class="password-container">
                            <input type="password" id="confirmNewPasswordInput" class="form-input" placeholder="Ulangi password baru" required minlength="6">
                            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirmNewPasswordInput')">👁️</button>
                        </div>
                    </div>

                    <button type="submit" class="btn-reset" id="resetBtn">Ubah Password</button>
                </form>

                <div style="text-align: center; margin-top: 15px;">
                    <button onclick="backToStep1()" style="background: none; border: none; color: #667eea; cursor: pointer; font-size: 13px; text-decoration: underline;">
                        ← Kembali
                    </button>
                </div>
            </div>
        </div>

        <div class="reset-footer">
            <a href="login.html">← Kembali ke Login</a>
        </div>
    </div>

    <script>
        // Firebase Config
        let db;
        const firebaseConfig = {
            apiKey: "AIzaSyBtyn-cjuhsnlEn-9Wao1tCcJfUQbf6GnY",
            authDomain: "simarsip-apk.firebaseapp.com",
            databaseURL: "https://simarsip-apk-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "simarsip-apk",
            storageBucket: "simarsip-apk.firebasestorage.app",
            messagingSenderId: "707332524030",
            appId: "1:707332524030:web:d91551b5f199df489622af"
        };

        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch (err) {
            console.error('Firebase init error:', err);
        }

        let verifiedUser = null; // Temporary storage untuk user yang sudah verified

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            document.getElementById('successMsg').classList.remove('show');
            document.getElementById('infoMsg').classList.remove('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 4000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMsg');
            successDiv.textContent = message;
            successDiv.classList.add('show');
            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('infoMsg').classList.remove('show');
        }

        function showInfo(message) {
            const infoDiv = document.getElementById('infoMsg');
            infoDiv.textContent = message;
            infoDiv.classList.add('show');
            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('successMsg').classList.remove('show');
        }

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const button = event.target;
            
            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = '👁️‍🗨️';
            } else {
                input.type = 'password';
                button.textContent = '👁️';
            }
        }

        function handleVerifyEmail(event) {
            event.preventDefault();

            const email = document.getElementById('emailInput').value.trim().toLowerCase();

            if (!email) {
                showError('Silakan masukkan email Anda');
                return;
            }

            document.getElementById('verifyBtn').disabled = true;
            document.getElementById('verifyBtn').textContent = 'Memverifikasi...';

            if (db) {
                db.ref('users').orderByChild('email').equalTo(email).once('value', snapshot => {
                    const users = snapshot.val();

                    if (!users) {
                        showError('Email tidak terdaftar di sistem');
                        document.getElementById('verifyBtn').disabled = false;
                        document.getElementById('verifyBtn').textContent = 'Verifikasi Email';
                        return;
                    }

                    // Ambil user pertama yang cocok
                    const userId = Object.keys(users)[0];
                    verifiedUser = { id: userId, ...users[userId] };

                    showSuccess('✅ Email diverifikasi! Silakan ubah password Anda.');
                    document.getElementById('resetEmailDisplay').value = email;

                    // Switch ke Step 2
                    setTimeout(() => {
                        document.getElementById('step1Form').classList.remove('visible-form');
                        document.getElementById('step1Form').classList.add('hidden-form');
                        document.getElementById('step2Form').classList.remove('hidden-form');
                        document.getElementById('step2Form').classList.add('visible-form');
                    }, 1500);

                }).catch(err => {
                    showError('Error: ' + err.message);
                    document.getElementById('verifyBtn').disabled = false;
                    document.getElementById('verifyBtn').textContent = 'Verifikasi Email';
                });
            }
        }

        function handleResetPassword(event) {
            event.preventDefault();

            const newPassword = document.getElementById('newPasswordInput').value;
            const confirmPassword = document.getElementById('confirmNewPasswordInput').value;

            if (!newPassword || !confirmPassword) {
                showError('Silakan isi semua field');
                return;
            }

            if (newPassword.length < 6) {
                showError('Password minimal 6 karakter');
                return;
            }

            if (newPassword !== confirmPassword) {
                showError('Password dan konfirmasi password tidak sesuai');
                return;
            }

            if (!verifiedUser) {
                showError('Terjadi error: User tidak ditemukan. Silakan coba lagi.');
                return;
            }

            document.getElementById('resetBtn').disabled = true;
            document.getElementById('resetBtn').textContent = 'Mengubah...';

            if (db) {
                // Update password di Firebase
                db.ref('users/' + verifiedUser.id).update({
                    password: newPassword
                }, (error) => {
                    if (error) {
                        showError('Terjadi error: ' + error.message);
                        document.getElementById('resetBtn').disabled = false;
                        document.getElementById('resetBtn').textContent = 'Ubah Password';
                    } else {
                        showSuccess('✅ Password berhasil diubah! Redirecting ke login...');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);
                    }
                });
            }
        }

        function backToStep1() {
            verifiedUser = null;
            document.getElementById('emailInput').value = '';
            document.getElementById('newPasswordInput').value = '';
            document.getElementById('confirmNewPasswordInput').value = '';
            document.getElementById('resetEmailDisplay').value = '';
            document.getElementById('verifyBtn').disabled = false;
            document.getElementById('verifyBtn').textContent = 'Verifikasi Email';
            document.getElementById('resetBtn').disabled = false;
            document.getElementById('resetBtn').textContent = 'Ubah Password';

            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('successMsg').classList.remove('show');
            document.getElementById('infoMsg').classList.remove('show');

            document.getElementById('step2Form').classList.remove('visible-form');
            document.getElementById('step2Form').classList.add('hidden-form');
            document.getElementById('step1Form').classList.remove('hidden-form');
            document.getElementById('step1Form').classList.add('visible-form');
        }
    </script>
</body>
</html>
