<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui">
    <title>SIMARSIP - Splash Screen</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            color: white;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .splash-logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2.5s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-25px);
            }
        }

        .splash-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .splash-subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 12px;
            margin-top: 20px;
            opacity: 0.8;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="splash-logo">📋</div>
        <div class="splash-title">SIMARSIP</div>
        <div class="splash-subtitle">Sistem Manajemen Surat & Pengajuan</div>
        <div class="spinner"></div>
        <div class="loading-text">Memuat aplikasi...</div>
    </div>

    <script>
    // initialize firebase to check user notifications on splash
    (function(){
      const script1 = document.createElement('script');
      script1.src = 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js';
      document.head.appendChild(script1);
      const script2 = document.createElement('script');
      script2.src = 'https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js';
      document.head.appendChild(script2);

      script2.onload = () => {
        try {
          const firebaseConfig = {
            apiKey: "AIzaSyBtyn-cjuhsnlEn-9Wao1tCcJfUQbf6GnY",
            authDomain: "simarsip-apk.firebaseapp.com",
            databaseURL: "https://simarsip-apk-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "simarsip-apk"
          };
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          const db = firebase.database();

          setTimeout(() => {
            const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));

            // SET DULU sebelum redirect
            sessionStorage.setItem("fromSplash", "true");

            if (!loggedUser) {
              window.location.href = "login.html";
              return;
            }

            const userId = loggedUser.uid || loggedUser.email || loggedUser.id || 'unknown';
            db.ref('notifications/users/' + userId).orderByChild('read').equalTo(false).limitToFirst(5).once('value').then(snap => {
              const unread = snap.exists() ? Object.keys(snap.val() || {}).length : 0;
              if (unread > 0) {
                alert(`Anda memiliki ${unread} notifikasi baru.`);
              }
            }).catch(() => {}).finally(() => {
              if (loggedUser.role === "super_admin" || loggedUser.role === "Admin Simarsip") {
                window.location.href = "index_admin.html";
              } else if (loggedUser.role === "BAA") {
                window.location.href = "index_baa.html";
              } else {
                window.location.href = "index.html";
              }
            });

          }, 4000);
        } catch (e) {
          // fallback redirect
          setTimeout(() => {
            const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
            sessionStorage.setItem("fromSplash", "true");
            if (!loggedUser) {
              window.location.href = "login.html";
            } else {
              if (loggedUser.role === "super_admin" || loggedUser.role === "Admin Simarsip") {
                window.location.href = "index_admin.html";
              } else if (loggedUser.role === "BAA") {
                window.location.href = "index_baa.html";
              } else {
                window.location.href = "index.html";
              }
            }
          }, 4000);
        }
      };
    })();
</script>
</body>
</html>
